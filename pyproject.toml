[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codeteam-backend"
version = "0.1.0"
description = "Multi-agent software development assistant backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "langchain>=0.3,<2.0",
    "langgraph>=0.2,<2.0",
    "langchain-openai>=0.2,<2.0",
    "pgvector>=0.3,<1.0",
    "celery[redis]>=5.4,<6.0",
    "gitpython>=3.1,<4.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4.0"]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.8,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/codeteam"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
